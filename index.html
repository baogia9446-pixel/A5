<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỉ Niệm Cấp 3 - Nguyễn Gia Bảo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&family=Quicksand:wght=500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4757;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
            height: 100vh; overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND ANIMATION --- */
        .falling-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .falling-item {
            position: absolute; top: -50px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* --- TRÁI TIM BAN ĐẦU --- */
        #heartContainer {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100; cursor: pointer; transition: all 1s ease;
            display: flex; justify-content: center; align-items: center;
        }
        .heart {
            background-color: var(--primary-color);
            height: 130px; width: 130px; position: relative;
            transform: rotate(-45deg); animation: beat .8s infinite alternate;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
        }
        .heart:before, .heart:after {
            content: ""; background-color: var(--primary-color);
            border-radius: 50%; height: 130px; width: 130px; position: absolute;
        }
        .heart:before { top: -65px; left: 0; }
        .heart:after { left: 65px; top: 0; }
        @keyframes beat { 0% { transform: scale(1) rotate(-45deg); } 100% { transform: scale(1.1) rotate(-45deg); } }

        .btn-nhan {
            position: absolute; background: white; border: 2px solid var(--primary-color);
            padding: 6px 18px; border-radius: 50px;
            font-weight: bold; color: var(--primary-color); z-index: 102;
            font-size: 1rem; pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* --- GIAO DIỆN CHỌN TÊN --- */
        #guideText {
            position: fixed; top: 20px; left: 25px;
            font-size: 1.3rem; font-weight: 900; color: var(--primary-color);
            opacity: 0; transition: 0.5s; z-index: 90;
            text-shadow: 1px 1px 0px white;
        }
        #guideText.show { opacity: 1; }

        #namesGrid {
            position: absolute; top: 80px; left: 2%; width: 96%;
            height: calc(100vh - 120px);
            display: grid; 
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(5, 1fr);
            opacity: 0; pointer-events: none; transition: 1s; z-index: 50;
        }
        #namesGrid.show { 
            opacity: 1 !important; 
            pointer-events: auto !important; 
        }

        .cell { display: flex; justify-content: center; align-items: center; position: relative; }

        .name-box {
            display: flex; justify-content: center; align-items: center;
            text-align: center; font-weight: bold; font-size: 0.85rem;
            color: white; cursor: pointer; transition: 0.3s; padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            z-index: 60;
        }
        .name-box:hover { transform: scale(1.25) !important; z-index: 99; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }

        .s-tron { border-radius: 50%; width: 78px; height: 78px; }
        .s-vuong { border-radius: 12px; width: 78px; height: 78px; }
        .s-elip { border-radius: 50% / 30%; width: 92px; height: 62px; }
        .s-lucgiac { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); width: 88px; height: 72px; }
        .s-gai { clip-path: polygon(50% 0%, 65% 20%, 85% 15%, 80% 35%, 100% 50%, 80% 65%, 85% 85%, 65% 80%, 50% 100%, 35% 80%, 15% 85%, 20% 65%, 0% 50%, 20% 35%, 15% 15%, 35% 20%); width: 88px; height: 88px; }

        /* --- MÀN HÌNH LỜI CHÚC --- */
        #wishPage {
            display: none; width: 100%; height: 100%;
            padding: 40px; position: relative; z-index: 10;
            justify-content: center; align-items: center;
            background: rgba(255, 253, 244, 0.4);
        }
        
        #noteBox {
            width: 55%; height: 80%; background: #ffffff;
            padding: 45px; border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border-left: 10px solid #ff7675;
            overflow-y: auto; display: flex; flex-direction: column;
            animation: popUp 0.5s ease forwards;
        }

        @keyframes popUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #handwriting {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem; line-height: 1.8; color: #2d3436;
            white-space: pre-wrap; word-wrap: break-word;
        }

        .gift-tag { font-family: 'Quicksand', sans-serif; color: #ff7675; font-weight: bold; font-size: 1.5rem; margin-bottom: 15px; display: block; }
        .signature { font-family: 'Quicksand', sans-serif; color: #ff4757; font-weight: 900; font-size: 1.4rem; margin-top: auto; text-align: right; display: block; padding-top: 25px; letter-spacing: 1px; }

        .selected-name-float {
            position: fixed; font-size: 1.4rem; font-weight: bold;
            color: white; z-index: 150; display: flex; justify-content: center; align-items: center;
            transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>

            giahan: "Hello bé Út của a nha. Ờm thì do ở xa nên anh không thể trực tiếp đến kí áo hay ghi lưu bút cho Út được á, nên thoi, những dòng này xem như là những j anh muốn nói với em nheee. Cảm ơn em vì đã trở thành một người đồng hành, một người tri kỉ cùng anh đi qua gần 12 năm trời, 12 năm không phải là quãng ngắn, nhưng nó lại không đủ để anh với Út hiểu hết được về nhau. Chúc Út đạt được Nguyện vọng 1, đạt được nhiều thành công trong cuộc sống. Luôn êm ấm bên người Út yêu nhé. Nhớ lời anh nhé, cố gắng tập trung, đừng để quá bị lôi kéo vào chuyện tình cảm nha. Chơi với nhau từ lâu, anh hiểu mà, em là đứa dễ khóc, tâm lí không vững, nên em dễ bị cuốn vào những chuyện rắc rối. Mặc dù kế em cũng đã có người kề bên, ở xa thì có anh đang trông lo. Nhưng cho dù có chuyện gì, hãy cứ cố gắng mạnh mẽ nhé. Lên đại học có lẽ anh với em sẽ được gặp nhau nhiều hơn, sẽ được nói chuyện nhiều hơn. Cám ơn em nhé, cảm ơn vì tất cả."
        };

        const g1 = ["Lê Na", "Mai Hương", "Yến Vi", "Đào Anh", "Hoài Bảo", "Thu Bình", "Cường", "Duy", "Minh Hoàng", "Hưng", "Lan Hương", "Khánh", "Đăng Khoa", "Trương Khoa", "Linh", "Nhi", "Tấn Phát", "Tài", "Thanh", "Trân", "Anh Tuấn", "Thành Tuấn", "Thảo Vy", "Kiều Ánh", "Diệp Chi", "Cẩm Tú", "Duyên", "Đặng Hoàng", "Mai Hoàng", "Huyền", "Khải"];
        const g2 = ["Phương Anh", "Võ Anh", "Hoài", "Hải Yến"];
        const g6 = ["Nhật", "Nhật Phát", "Tuấn Kiệt", "Hoàng Long", "Nhật Minh"];

        function createFall() {
            const types = ['🌸', '🍂', '⭐', '🍀', '✨'];
            const item = document.createElement('div');
            item.className = 'falling-item';
            item.innerText = types[Math.floor(Math.random() * types.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.fontSize = Math.random() * 18 + 12 + 'px';
            const duration = Math.random() * 4 + 6; 
            item.style.animationDuration = duration + 's';
            document.getElementById('fallZone').appendChild(item);
            setTimeout(() => item.remove(), duration * 1000);
        }
        setInterval(createFall, 250);

        function startWeb() {
            const heart = document.getElementById('heartContainer');
            heart.style.top = '15px';
            heart.style.transform = 'translate(-50%, 0) scale(0.3)';
            heart.onclick = null; 
            
            document.querySelector('.btn-nhan').style.display = 'none';
            document.getElementById('guideText').classList.add('show');
            
            const grid = document.getElementById('namesGrid');
            grid.classList.add('show'); 
            grid.innerHTML = ''; 

            const shuffled = [...names].sort(() => Math.random() - 0.5);

            shuffled.forEach(name => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const box = document.createElement('div');
                const randomShape = shapes[Math.floor(Math.random() * shapes.length)];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                box.className = `name-box ${randomShape}`;
                box.style.backgroundColor = randomColor;
                box.innerText = name;
                
                const moveX = Math.floor(Math.random() * 20) - 10;
                const moveY = Math.floor(Math.random() * 20) - 10;
                const rotate = Math.floor(Math.random() * 20) - 10;
                box.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg)`;
                
                box.onclick = (e) => selectName(name, e, randomColor, randomShape);
                
                cell.appendChild(box);
                grid.appendChild(cell);
            });
        }

        function selectName(name, e, bgColor, shapeClass) {
            document.getElementById('namesGrid').classList.remove('show');
            document.getElementById('namesGrid').style.opacity = '0';
            document.getElementById('namesGrid').style.pointerEvents = 'none';
            document.getElementById('guideText').classList.remove('show');
            document.getElementById('guideText').style.opacity = '0';
            document.getElementById('heartContainer').style.opacity = '0';

            const floatName = document.createElement('div');
            floatName.className = `selected-name-float ${shapeClass}`;
            floatName.style.backgroundColor = bgColor;
            floatName.innerText = name;
            floatName.style.left = (e.clientX - 40) + 'px';
            floatName.style.top = (e.clientY - 40) + 'px';
            document.body.appendChild(floatName);

            setTimeout(() => {
                floatName.style.left = '50%';
                floatName.style.top = '15px';
                floatName.style.transform = 'translateX(-50%) scale(0.9)';
            }, 100);

            setTimeout(() => {
                document.getElementById('wishPage').style.display = 'flex';
                startWriting(name);
            }, 1900);
        }

        function startWriting(name) {
            let content = "";
            let tagText = "Gửi tặng,";

            if (name === "Quỳnh Hoa") {
                content = wishes.quynhhoa;
                tagText = "Gửi tặng Quỳnh Hoa,";
            } else if (name === "Ngọc Anh") {
                content = wishes.ngocanh;
                tagText = "Gửi tặng Ngọc Anh (Na),";
            } else if (name === "Gia Hân") {
                content = wishes.giahan;
                tagText = "Gửi tặng bé Út Gia Hân,";
            } else if (g1.includes(name)) {
                content = wishes.group1;
            } else if (g2.includes(name)) {
                content = wishes.group2;
            } else if (name === "Dũng") {
                content = wishes.dung;
            } else if (name === "Đạt") {
                content = wishes.dat;
            } else if (name === "Ngọc") {
                content = wishes.ngoc;
            } else if (g6.includes(name)) {
                content = wishes.group6;
            } else if (name === "Anh Thư") {
                content = wishes.thu;
            }

            document.getElementById('giftTagText').innerText = tagText;
            const element = document.getElementById('handwriting');
            element.innerHTML = '';
            
            let i = 0;
            const totalTime = 7000; 
            const speed = totalTime / content.length;

            function type() {
                if (i < content.length) {
                    element.innerHTML += content.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }
    </script>
</body>
